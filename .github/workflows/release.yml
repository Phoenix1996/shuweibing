name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Validate version and tag
        id: version
        run: |
          $version=./src/get-version.ps1
          if($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version"){
            throw 'Release tag does not match VERSION'
          }
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Install verified Zig 0.15.2
        run: ./src/setup-zig.ps1
      - name: Build Windows executable
        run: ./src/build.ps1 -Zig './.build/toolchain/zig-x86_64-windows-0.15.2/zig.exe'
      - name: Test owned windows and processes
        run: ./src/test.ps1 -Zig './.build/toolchain/zig-x86_64-windows-0.15.2/zig.exe' -CI
      - name: Package with attribution and checksums
        run: ./src/package.ps1
      - name: Save release package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: shuweibing-${{ steps.version.outputs.version }}-windows-x64
          path: dist/packages/${{ steps.version.outputs.version }}/*
          if-no-files-found: error
          retention-days: 14
      - name: Save test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-report
          path: .build/tests-*/test-results.txt
          if-no-files-found: warn
          retention-days: 14

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: shuweibing-${{ needs.build.outputs.version }}-windows-x64
          path: package
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          APP_VERSION: ${{ needs.build.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          test "$RELEASE_TAG" = "v$APP_VERSION"
          if draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            if [[ "$draft" != true ]]; then
              echo 'Release is already published; keeping published files unchanged.'
              exit 0
            fi
          else
            gh release create "$RELEASE_TAG" --draft --verify-tag \
              --title "鼠卫兵 $APP_VERSION" --notes-file package/RELEASE_NOTES.md
          fi
          gh release upload "$RELEASE_TAG" package/ShuWeiBing.exe \
            "package/ShuWeiBing-$APP_VERSION-windows-x64.zip" package/SHA256SUMS.txt --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest \
            --notes-file package/RELEASE_NOTES.md
